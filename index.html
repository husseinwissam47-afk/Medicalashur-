<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابع تراكمات المحاضرات - المرحلة الثالثة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--primary:#0288D1;--primary-dark:#01579B;--primary-light:#E0F7FA;--accent:#00A896;--bg-color:#F0F8FF;--card-bg:#FFF;--text-dark:#1A252C;--text-muted:#5A6E79;--border-color:#D0E3EF;--completed-green:#2E7D32;--pending-red:#C62828;--border-radius:14px}
[data-theme="sky-sea"]{--primary:#0288D1;--primary-dark:#01579B;--primary-light:#E0F7FA;--accent:#023E8A;--bg-color:#F0F8FF;--card-bg:#FFF;--text-dark:#1A252C;--text-muted:#5A6E79;--border-color:#D0E3EF}
[data-theme="brown-beige"]{--primary:#4A3525;--primary-dark:#2C1E14;--primary-light:#F5EBE6;--accent:#C68B59;--bg-color:#FAF6F0;--card-bg:#FFF;--text-dark:#2A1D15;--text-muted:#7A685B;--border-color:#E8D8CE}
[data-theme="pink-white"]{--primary:#D81B60;--primary-dark:#880E4F;--primary-light:#FCE4EC;--accent:#FF80AB;--bg-color:#FFF5F8;--card-bg:#FFF;--text-dark:#331A24;--text-muted:#885A6E;--border-color:#F8D0DF}
[data-theme="burgundy"]{--primary:#58111A;--primary-dark:#3B0B11;--primary-light:#FFF8E7;--accent:#E5A93C;--bg-color:#FBF8F5;--card-bg:#FFF;--text-dark:#2A1810;--text-muted:#7A635B;--border-color:#EFE4DC}
body.dark-mode{--bg-color:#000;--card-bg:#121212;--text-dark:#F5F5F5;--text-muted:#A0A0A0;--border-color:#262626;--primary-light:#1A1A1A}
*{box-sizing:border-box;font-family:'Tajawal',sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg-color);color:var(--text-dark);padding:20px 12px 60px;direction:rtl;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;transition:background-color .3s,color .3s}
.container{max-width:900px;margin:0 auto;width:100%}
header{text-align:center;margin-bottom:20px;padding:22px 20px;background:linear-gradient(135deg,var(--primary-dark),var(--primary));border-radius:var(--border-radius);box-shadow:0 8px 20px #0002;color:#fff;border-bottom:4px solid var(--accent)}
header h1{font-size:1.8rem;font-weight:800;color:#fff;margin-bottom:6px}header p{color:#ffffffd9;font-size:.95rem}
.tools-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;background:var(--card-bg);padding:12px 16px;border-radius:var(--border-radius);margin-bottom:20px;border:1px solid var(--border-color);box-shadow:0 4px 12px #0000000a}
.tool-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool-btn{background:var(--primary-light);color:var(--primary-dark);border:1px solid var(--border-color);padding:6px 12px;border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
body.dark-mode .tool-btn{color:var(--text-dark)}.theme-select{background:var(--card-bg);color:var(--text-dark);border:1px solid var(--border-color);padding:6px 10px;border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer}
.overall-progress-card{background:var(--card-bg);border-radius:var(--border-radius);padding:18px 20px;margin-bottom:20px;border:1px solid var(--border-color);box-shadow:0 4px 15px #0000000a}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:.95rem;color:var(--primary)}
.progress-bar-bg{height:12px;background:var(--primary-light);border-radius:10px;overflow:hidden}.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));width:0%;transition:width .4s;border-radius:10px}
.modules-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px;scrollbar-width:thin}
.module-tab{background:var(--card-bg);color:var(--text-dark);border:1.5px solid var(--border-color);padding:8px 14px;border-radius:20px;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.module-tab.active,.module-tab:hover{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 10px #0002}.module-icon{font-size:1.1rem}
.section-title{font-size:1.2rem;font-weight:800;color:var(--primary);margin:20px 0 12px;padding-right:12px;border-right:4px solid var(--accent);display:flex;align-items:center;justify-content:space-between}
.subjects-grid{display:flex;flex-direction:column;gap:12px}.subject-card{background:var(--card-bg);border-radius:var(--border-radius);box-shadow:0 2px 8px #0000000a;overflow:hidden;border:1px solid var(--border-color)}
.subject-header{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:var(--card-bg);user-select:none}.subject-header:hover{background:var(--primary-light)}
.subject-title{font-size:.98rem;font-weight:700;color:var(--text-dark);display:flex;align-items:center;gap:6px}.subject-stats{display:flex;gap:8px;font-size:.8rem;flex-wrap:wrap}
.badge{padding:3px 9px;border-radius:12px;font-weight:700;white-space:nowrap}.badge-completed{background:#2e7d321f;color:var(--completed-green)}.badge-pending{background:#c628281f;color:var(--pending-red)}
.lectures-list{display:none;padding:10px 18px 15px;background:var(--card-bg);border-top:1px solid var(--border-color)}.subject-card.active .lectures-list{display:block}
.lecture-item-container{border-bottom:1px dashed var(--border-color);padding:8px 0}.lecture-item-container:last-child{border-bottom:none}.lecture-item{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lecture-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.lecture-checkbox{width:19px;height:19px;cursor:pointer;accent-color:var(--primary);flex-shrink:0}
.lecture-title{font-size:.92rem;color:var(--text-dark);font-weight:600;overflow-wrap:anywhere}.lecture-title.done{text-decoration:line-through;color:var(--text-muted)}
.status-tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}.status-tag.done{background:#2e7d321f;color:var(--completed-green)}.status-tag.pending{background:#c628281f;color:var(--pending-red)}
.icon-btn{background:none;border:none;cursor:pointer;font-size:.85rem;opacity:.7;padding:2px 4px;flex-shrink:0}.lecture-note-area{margin-top:6px;padding-right:30px}.note-input{width:100%;padding:6px 10px;border:1px solid var(--border-color);border-radius:6px;font-size:.82rem;background:var(--primary-light);color:var(--text-dark);outline:none}
footer{margin-top:40px;text-align:center;padding:18px 10px;background:var(--primary-dark);border-radius:var(--border-radius);box-shadow:0 4px 15px #0002;border-top:3px solid var(--accent)}footer a{color:#fff;text-decoration:none;font-weight:800;font-size:1.05rem;display:inline-flex;align-items:center;gap:8px}
@media(max-width:600px){header h1{font-size:1.4rem}.tools-bar{flex-direction:column;align-items:stretch}.tool-group{justify-content:space-between}.subject-header{align-items:flex-start;flex-direction:column}.lecture-item{align-items:flex-start}.status-tag{margin-top:3px}}
@media print{body{background:#fff!important;color:#111!important}.subject-card{break-inside:avoid}.lectures-list{display:block!important}}
</style>
</head>
<body data-theme="sky-sea">
<div class="container" id="printableArea">
<header><h1>📚 متابع تراكمات - المرحلة الثالثة</h1><p>تأشير المحاضرات، كتابة ملاحظات، وتخصيص الثيمات</p></header>
<div class="tools-bar" data-html2canvas-ignore="true">
<div class="tool-group"><select class="theme-select" id="themeSelect" onchange="changeColorPalette(this.value)"><option value="sky-sea">🌊 سمائي وبحري</option><option value="brown-beige">☕ بني غامق وبيجي</option><option value="pink-white">🌸 وردي فاتح وأبيض</option><option value="burgundy">🍷 عنابي وذهبي</option></select>
<button class="tool-btn" onclick="toggleDarkMode()"><span id="darkModeIcon">🌙</span> <span id="darkModeText">الوضع الداكن الأسود</span></button></div>
<div class="tool-group"><button class="tool-btn" onclick="exportToPDF()">📄 تصدير كـ PDF</button></div>
</div>
<div class="overall-progress-card"><div class="progress-header"><span>نسبة الإنجاز الكلية للمرحلة:</span><span id="overallPercent">0%</span></div><div class="progress-bar-bg"><div class="progress-bar-fill" id="overallFill"></div></div></div>
<div class="modules-nav" id="modulesNav" data-html2canvas-ignore="true"></div><div id="modulesContainer"></div>
</div>
<footer data-html2canvas-ignore="true"><a href="https://t.me/medicinewithfunny" target="_blank" rel="noopener noreferrer">مشغل بواسطة: طب 🩺 وسد الباب🚪</a></footer>
<script>
const makeList=(prefix,count)=>Array.from({length:count},(_,i)=>`${prefix}-${i+1}`);
const defaultModulesData={
id:{title:'ID | Infectious Diseases',icon:'🦠',sections:[{name:'📚 النظري',subjects:[{id:'id_micro',name:'Microbiology (النظري)',lectures:makeList('Lec',21)},{id:'id_medicine',name:'Medicine (النظري)',lectures:makeList('Lec',11)},{id:'id_community',name:'Community Medicine (النظري)',lectures:makeList('Lec',10)},{id:'id_surgery',name:'Surgery (النظري)',lectures:makeList('Lec',1)}]},{name:'🔬 العملي & TBL',subjects:[{id:'id_micro_prac',name:'Microbiology - Practical',lectures:makeList('P',5)},{id:'id_comm_tbl',name:'Community - TBL & Lab',lectures:makeList('TBL',1)},{id:'id_med_tbl',name:'Medicine - TBL',lectures:makeList('TBL',1)},{id:'id_surg_tbl',name:'Surgery - TBL',lectures:makeList('TBL',3)}]}]},
nt:{title:'NT | Nutrition Module',icon:'🥗',sections:[{name:'📚 النظري',subjects:[{id:'nt_comm',name:'Community Medicine (النظري)',lectures:makeList('Lec',11)},{id:'nt_biochem',name:'Biochemistry (النظري)',lectures:makeList('Lec',9)},{id:'nt_medicine',name:'Medicine (النظري)',lectures:makeList('Lec',10)},{id:'nt_physio',name:'Physiology (النظري)',lectures:makeList('Lec',2)},{id:'nt_surgery',name:'Surgery (النظري)',lectures:makeList('Lec',5)}]},{name:'🔬 العملي & TBL',subjects:[{id:'nt_comm_tbl',name:'Community Medicine - TBL',lectures:makeList('TBL',1)},{id:'nt_biochem_tbl',name:'Biochemistry - TBL',lectures:makeList('TBL',2)},{id:'nt_med_tbl',name:'Medicine - TBL',lectures:makeList('TBL',1)},{id:'nt_surg_tbl',name:'Surgery - TBL',lectures:makeList('TBL',1)}]}]},
rm:{title:'RM | Research Methodology',icon:'📊',sections:[{name:'📚 Theoretical',subjects:[{id:'rm_theory',name:'Research Methodology (النظري)',lectures:makeList('Lec',22)}]},{name:'👥 Team Based Learning (TBL)',subjects:[{id:'rm_tbl',name:'Research Methodology - TBL',lectures:makeList('TBL',13)}]}]},
ca:{title:'CA | Clinical Attachment',icon:'🩺',sections:[{name:'📚 النظري',subjects:[{id:'ca_medicine_theory',name:'Medicine (النظري)',lectures:makeList('Lec',12)}]},{name:'🩺 العملي - Medicine',subjects:[{id:'ca_med_history',name:'Medical History',lectures:makeList('S',7)},{id:'ca_med_exam',name:'Clinical Examination',lectures:makeList('Session',5)}]},{name:'🔪 العملي - Surgery',subjects:[{id:'ca_surg_history',name:'Surgical History',lectures:makeList('SS',4)},{id:'ca_surg_exam',name:'Surgical Examination',lectures:makeList('Session',4)}]},{name:'🎯 Practicing Skills Lab',subjects:[{id:'ca_skills_lab',name:'Practicing Skills Lab',lectures:makeList('PS',2).map(s=>s+'-SL')}]}]}
};
function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){return fallback}}
let modulesData=readJSON('stage3_modules_config',defaultModulesData),savedState=readJSON('stage3_med_progress_num_only',{}),notesData=readJSON('stage3_med_notes',{}),activeModule='id',activeTheme=localStorage.getItem('stage3_theme')||'sky-sea',isDarkMode=localStorage.getItem('stage3_darkmode')==='true';
function applyThemeSettings(){document.body.setAttribute('data-theme',activeTheme);document.getElementById('themeSelect').value=activeTheme;document.body.classList.toggle('dark-mode',isDarkMode);document.getElementById('darkModeIcon').innerText=isDarkMode?'☀️':'🌙';document.getElementById('darkModeText').innerText=isDarkMode?'الوضع الفاتح':'الوضع الداكن الأسود'}
function changeColorPalette(theme){activeTheme=theme;localStorage.setItem('stage3_theme',theme);applyThemeSettings()}
function toggleDarkMode(){isDarkMode=!isDarkMode;localStorage.setItem('stage3_darkmode',isDarkMode);applyThemeSettings()}
function switchModule(key){activeModule=key;renderNav();render()}
function renderNav(){const nav=document.getElementById('modulesNav');nav.innerHTML='';Object.keys(modulesData).forEach(key=>{const btn=document.createElement('button');btn.className='module-tab '+(key===activeModule?'active':'');btn.onclick=()=>switchModule(key);const icon=document.createElement('span');icon.className='module-icon';icon.textContent=modulesData[key].icon||'📖';const title=document.createElement('span');title.textContent=modulesData[key].title;const edit=document.createElement('span');edit.className='icon-btn';edit.textContent='✏️';edit.onclick=e=>{e.stopPropagation();editModuleTitle(key)};btn.append(icon,title,edit);nav.appendChild(btn)})}
function calculateOverallProgress(){let total=0,done=0;Object.values(modulesData).forEach(m=>m.sections.forEach(s=>s.subjects.forEach(sub=>sub.lectures.forEach((_,i)=>{total++;if(savedState[sub.id]?.[i])done++}))));const p=total?Math.round(done/total*100):0;document.getElementById('overallPercent').innerText=`${p}% (${done}/${total})`;document.getElementById('overallFill').style.width=p+'%'}
function findSubject(id){for(const m of Object.values(modulesData))for(const s of m.sections)for(const sub of s.subjects)if(sub.id===id)return sub;return null}
function render(){const container=document.getElementById('modulesContainer');container.innerHTML='';const mod=modulesData[activeModule];if(!mod)return;const wrap=document.createElement('div');mod.sections.forEach(sec=>{const st=document.createElement('div');st.className='section-title';st.textContent=sec.name;wrap.appendChild(st);const grid=document.createElement('div');grid.className='subjects-grid';sec.subjects.forEach(sub=>{savedState[sub.id] ||= {};const done=sub.lectures.reduce((n,_,i)=>n+(savedState[sub.id][i]?1:0),0);const card=document.createElement('div');card.className='subject-card';card.id='card-'+sub.id;const head=document.createElement('div');head.className='subject-header';head.onclick=()=>toggleCard(sub.id);const nameWrap=document.createElement('div');nameWrap.className='subject-title';const name=document.createElement('span');name.textContent=sub.name;const editSub=document.createElement('button');editSub.className='icon-btn';editSub.textContent='✏️';editSub.onclick=e=>{e.stopPropagation();editSubjectTitle(sub.id)};nameWrap.append(name,editSub);const stats=document.createElement('div');stats.className='subject-stats';stats.innerHTML=`<span class="badge badge-completed">مكتمل: ${done}</span><span class="badge badge-pending">متراكم: ${sub.lectures.length-done}</span>`;head.append(nameWrap,stats);card.appendChild(head);const list=document.createElement('div');list.className='lectures-list';sub.lectures.forEach((lec,i)=>{const key=`${sub.id}_${i}`,isDone=!!savedState[sub.id][i];const row=document.createElement('div');row.className='lecture-item-container';const item=document.createElement('div');item.className='lecture-item';const info=document.createElement('div');info.className='lecture-info';const cb=document.createElement('input');cb.type='checkbox';cb.className='lecture-checkbox';cb.checked=isDone;cb.onchange=()=>toggleLecture(sub.id,i);const label=document.createElement('span');label.className='lecture-title'+(isDone?' done':'');label.textContent=lec;const editLec=document.createElement('button');editLec.className='icon-btn';editLec.textContent='✏️';editLec.onclick=()=>editLectureTitle(sub.id,i);const noteBtn=document.createElement('button');noteBtn.className='icon-btn';noteBtn.textContent='📝';noteBtn.onclick=()=>toggleNoteField(key);info.append(cb,label,editLec,noteBtn);const status=document.createElement('span');status.className='status-tag '+(isDone?'done':'pending');status.textContent=isDone?'مكتملة ✓':'متراكمة ✗';item.append(info,status);row.appendChild(item);const noteArea=document.createElement('div');noteArea.id='note-box-'+key;noteArea.className='lecture-note-area';noteArea.style.display=notesData[key]?'block':'none';const input=document.createElement('input');input.className='note-input';input.value=notesData[key]||'';input.placeholder='اكتب ملاحظة...';input.onchange=()=>saveNote(key,input.value);noteArea.appendChild(input);row.appendChild(noteArea);list.appendChild(row)});card.append(head,list);grid.appendChild(card)});wrap.appendChild(grid)});container.appendChild(wrap);calculateOverallProgress()}
function toggleCard(id){document.getElementById('card-'+id)?.classList.toggle('active')}
function toggleLecture(id,i){savedState[id] ||= {};savedState[id][i]=!savedState[id][i];localStorage.setItem('stage3_med_progress_num_only',JSON.stringify(savedState));const opened=[...document.querySelectorAll('.subject-card.active')].map(c=>c.id);render();opened.forEach(id=>document.getElementById(id)?.classList.add('active'))}
function editModuleTitle(key){const v=prompt('تعديل اسم الموديول:',modulesData[key].title);if(v&&v.trim()){modulesData[key].title=v.trim();saveModulesConfig();renderNav()}}
function editSubjectTitle(id){const sub=findSubject(id);if(!sub)return;const v=prompt('تعديل اسم المادة:',sub.name);if(v&&v.trim()){sub.name=v.trim();saveModulesConfig();render()}}
function editLectureTitle(id,i){const sub=findSubject(id);if(!sub)return;const v=prompt('تعديل اسم المحاضرة:',sub.lectures[i]);if(v&&v.trim()){sub.lectures[i]=v.trim();saveModulesConfig();render()}}
function saveModulesConfig(){localStorage.setItem('stage3_modules_config',JSON.stringify(modulesData))}
function toggleNoteField(key){const el=document.getElementById('note-box-'+key);if(el)el.style.display=el.style.display==='none'?'block':'none'}
function saveNote(key,value){notesData[key]=value.trim();localStorage.setItem('stage3_med_notes',JSON.stringify(notesData))}
async function exportToPDF(){if(typeof html2pdf==='undefined'){alert('تعذر تحميل مكتبة PDF. تأكد من اتصال الإنترنت ثم أعد المحاولة.');return}const area=document.getElementById('printableArea');const oldModule=activeModule;const nav=document.getElementById('modulesNav');const container=document.getElementById('modulesContainer');const oldNavDisplay=nav.style.display;const oldContainerHTML=container.innerHTML;const oldOpen=[...document.querySelectorAll('.subject-card.active')].map(c=>c.id);try{nav.style.display='none';const all=[];Object.keys(modulesData).forEach(key=>{activeModule=key;render();document.querySelectorAll('.subject-card').forEach(c=>c.classList.add('active'));all.push({title:modulesData[key].title,html:container.innerHTML})});container.innerHTML=all.map(m=>`<h2 style="margin:18px 0;color:var(--primary);">${escapeHTML(m.title)}</h2>${m.html}`).join('');document.querySelectorAll('.subject-card').forEach(c=>c.classList.add('active'));const opt={margin:.3,filename:'تراكمات_المرحلة_الثالثة.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:getComputedStyle(document.body).getPropertyValue('--bg-color')},jsPDF:{unit:'in',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}};await html2pdf().set(opt).from(area).save()}catch(e){alert('حدث خطأ أثناء إنشاء PDF. جرّب مرة أخرى مع اتصال بالإنترنت.')}finally{activeModule=oldModule;nav.style.display=oldNavDisplay;renderNav();render();oldOpen.forEach(id=>document.getElementById(id)?.classList.add('active'))}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
applyThemeSettings();renderNav();render();
</script>
</body>
</html>
